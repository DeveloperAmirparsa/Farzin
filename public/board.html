<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090c0c">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/farzin-logo.png">
<title>تابلو قیمت فرزین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0b100f;--panel:#121a18;--line:#2d3934;--gold:#d4bc83;--text:#f2f1eb;--muted:#adb5af}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
#boardCanvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh;background:var(--ink);image-rendering:auto}
.board-controls{position:fixed;z-index:5;top:clamp(10px,1.2vw,24px);left:clamp(10px,1.2vw,24px);display:flex;align-items:center;gap:clamp(6px,.55vw,11px);max-width:calc(100vw - 20px);padding:clamp(8px,.65vw,13px) clamp(10px,.85vw,17px);border:1px solid #ffffff1a;border-radius:12px;background:#0b100fe8;backdrop-filter:blur(14px);transition:opacity .35s;box-shadow:0 8px 28px #0008}
.board-controls button,.board-controls a,.board-controls .farzin-logout{border:1px solid #ffffff20;border-radius:8px;background:#17201d;color:var(--text);font:600 clamp(11px,.62vw,14px) Vazirmatn,Tahoma,sans-serif;padding:clamp(7px,.48vw,11px) clamp(10px,.72vw,15px);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.board-controls button:hover,.board-controls a:hover,.board-controls .farzin-logout:hover{background:#24302b;border-color:#d4bc8380;color:#f6e6bd}
.board-controls .farzin-logout{position:static;z-index:auto;backdrop-filter:none}
.source-credit{position:fixed;z-index:3;bottom:clamp(5px,.5vw,10px);left:clamp(8px,.6vw,12px);padding:4px 9px;border:1px solid #d8bd7a38;border-radius:8px;background:#0b1110dd;color:var(--gold);font:500 clamp(9px,.5vw,12px) Vazirmatn,Tahoma,sans-serif;text-decoration:none;opacity:.82}
.source-credit:hover{opacity:1}
#boardStatus{font-size:clamp(10px,.56vw,13px);color:#d3d0c3;white-space:nowrap;max-width:min(42vw,680px);overflow:hidden;text-overflow:ellipsis}
.live-dot{width:9px;height:9px;flex:none;border-radius:50%;background:#82d2a0;box-shadow:0 0 14px #82d2a0;display:inline-block;margin-left:5px}
.live-dot.error{background:#ed8278;box-shadow:0 0 14px #ed8278}
.board-controls.hidden{opacity:0;pointer-events:none}.board-controls:hover{opacity:1;pointer-events:auto}
@media(max-width:760px){.board-controls{flex-wrap:wrap;gap:5px;top:6px;left:6px;padding:6px;max-width:calc(100vw - 12px)}.board-controls button,.board-controls a,.board-controls .farzin-logout{font-size:10px;padding:6px 8px}#boardStatus{order:2;flex:1 1 100%;max-width:100%;font-size:9px}}
</style>
</head>
<body>
<canvas id="boardCanvas" width="1920" height="1080" aria-label="تابلو زنده قیمت طلا و سکه فرزین"></canvas>
<div class="board-controls" id="boardControls">
  <span class="live-dot" id="liveDot"></span><span id="boardStatus">در حال راه‌اندازی تابلو…</span>
  <button type="button" data-pwa-install>نصب وب‌اپ</button>
  <button id="fullscreenBtn" type="button">تمام‌صفحه</button>
  <button id="refreshBtn" type="button">بروزرسانی همین حالا</button>
  <button class="farzin-logout" id="farzinLogout" type="button">خروج امن</button>
  <a href="/board-config" target="_blank" rel="noreferrer">کانفیگ تابلو</a>
  <a href="https://www.tgju.org/" target="_blank" rel="noreferrer">TGJU</a>
  <a href="/" target="_blank" rel="noreferrer">استودیو استوری</a>
</div>
<a class="source-credit" href="https://www.tgju.org/" target="_blank" rel="noopener noreferrer">منبع تمام قیمت‌ها · TGJU</a>
<script>
(function(){
  window.__farzinBoardBooted=false;
  window.__farzinBoardBootTimer=setTimeout(function(){
    if(window.__farzinBoardBooted)return;
    var status=document.getElementById('boardStatus');
    if(status)status.textContent='فایل برنامه تابلو اجرا نشد؛ صفحه را با Ctrl+F5 تازه‌سازی کن و مطمئن شو از آدرس سرور محلی باز شده است.';
  },7000);
  window.addEventListener('error',function(event){
    if(event.target&&event.target.tagName==='SCRIPT'){
      var status=document.getElementById('boardStatus');
      if(status)status.textContent='بارگذاری فایل تابلو ناموفق بود: '+(event.target.src||'فایل جاوااسکریپت');
    }
  },true);
  if(!window.structuredClone){window.structuredClone=function(value){return JSON.parse(JSON.stringify(value));};}
})();
</script>
<script src="/asset-catalog.js"></script><script src="/asset-icons.js"></script><script src="/quote-pricing.js"></script><script src="/pwa.js" defer></script><script src="/board.js" onerror="document.getElementById('boardStatus').textContent='فایل board.js از سرور دریافت نشد؛ پوشه نسخه را بررسی کن.'"></script><script>window.addEventListener('load',function(){if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/service-worker.js').catch(function(error){console.warn('[Farzin PWA]',error);});},{once:true});</script>
</body>
</html>
